<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>pi-agent-cloud</title>
<style>
  /* 视觉取色自 agegr/pi-web v0.14.1 的 app/globals.css（同一套 design token） */
  :root {
    color-scheme: light;
    --bg: #ffffff; --bg-panel: #f5f5f5; --bg-hover: #eeeeee; --bg-selected: #e8e8e8;
    --border: #e0e0e0; --text: #1a1a1a; --text-muted: #515c6b; --text-dim: #5e6673;
    --accent: #245bce; --accent-hover: #1d4ed8; --accent-contrast: #ffffff;
    --user-bg: #eff6ff; --assistant-bg: #ffffff; --tool-bg: #f9fafb;
    --chat-max: 820px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --bg: #1a1a1a; --bg-panel: #242424; --bg-hover: #2e2e2e; --bg-selected: #383838;
      --border: #454545; --text: #e8e8e8; --text-muted: #b7b7b7; --text-dim: #a4a4a4;
      --accent: #a4c2f4; --accent-hover: #c3d8fa; --accent-contrast: #182234;
      --user-bg: #292929; --assistant-bg: #1a1a1a; --tool-bg: #222222;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.65 ui-sans-serif, system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    display: flex; flex-direction: column; height: 100dvh;
  }
  header {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 10px 16px; border-bottom: 1px solid var(--border); background: var(--bg-panel);
  }
  header .brand { font-size: 15px; font-weight: 600; letter-spacing: .2px; }
  .chip {
    font-size: 12px; padding: 2px 10px; border-radius: 999px;
    border: 1px solid var(--border); color: var(--text-muted); background: var(--bg);
  }
  .chip.ok { color: #2f9e44; border-color: #2f9e4466; }
  .chip.warn { color: #c77c02; border-color: #c77c0266; }
  .chip.err { color: #e03131; border-color: #e0313166; }
  .spacer { flex: 1; }
  button {
    background: var(--bg); color: var(--text); border: 1px solid var(--border);
    border-radius: 8px; padding: 6px 14px; cursor: pointer; font: inherit; font-size: 13px;
  }
  button:hover { border-color: var(--accent); color: var(--accent); }
  button:disabled { opacity: .5; cursor: default; }
  main {
    flex: 1; overflow-y: auto; padding: 20px 16px 8px;
    display: flex; flex-direction: column; gap: 12px;
  }
  main > * { width: 100%; max-width: var(--chat-max); margin: 0 auto; }
  .msg { padding: 9px 14px; border-radius: 12px; white-space: pre-wrap; word-break: break-word; max-width: 88%; }
  .user { align-self: flex-end; background: var(--user-bg); border: 1px solid var(--border); }
  .bot { align-self: flex-start; background: var(--assistant-bg); border: 1px solid var(--border); }
  .tool {
    align-self: flex-start; max-width: 95%; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12px; color: var(--text-dim); background: var(--tool-bg);
    border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; cursor: pointer;
  }
  .tool pre, details.raw pre {
    margin: 6px 0 0; color: var(--text); max-height: 240px; overflow: auto;
    white-space: pre-wrap; word-break: break-word;
  }
  details.raw { color: var(--text-dim); font-size: 11px; align-self: stretch; max-width: 95%; }
  .notice { color: var(--text-dim); font-size: 12px; text-align: center; }
  footer { padding: 12px 16px 16px; border-top: 1px solid var(--border); background: var(--bg-panel); }
  .row { max-width: var(--chat-max); margin: 0 auto; display: flex; gap: 8px; align-items: flex-end; }
  textarea {
    flex: 1; background: var(--bg); color: var(--text); border: 1px solid var(--border);
    border-radius: 10px; padding: 10px 12px; font: inherit; resize: none; height: 44px; max-height: 160px;
  }
  textarea:focus { outline: none; border-color: var(--accent); }
</style>
</head>
<body>
<header>
  <span class="brand">pi-agent-cloud</span>
  <span id="model" class="chip">model: …</span>
  <span id="kb" class="chip">AI Search: …</span>
  <span class="spacer"></span>
  <button id="setup" title="创建 AI Search 实例（幂等）">初始化知识库</button>
  <button id="transcript">查看转录</button>
  <button id="reset">重置会话</button>
</header>
<main id="log">
  <div class="notice">问「知识库里的暗号是什么？」验证检索链路；会话保存在 Durable Object 里，刷新不丢。</div>
</main>
<footer>
  <div class="row">
    <textarea id="input" placeholder="问点什么…（Enter 发送，Shift+Enter 换行）"></textarea>
    <button id="send">发送</button>
  </div>
</footer>
<script>
const $ = (id) => document.getElementById(id);
const log = $("log");
let busy = false;

function bubble(cls, text) {
  const el = document.createElement("div");
  el.className = "msg " + cls;
  el.textContent = text;
  log.appendChild(el);
  log.scrollTop = log.scrollHeight;
  return el;
}
function toolLine(name, args, result) {
  const el = document.createElement("details");
  el.className = "tool";
  const s = document.createElement("summary");
  s.textContent = "tool · " + name + "(" + JSON.stringify(args ?? {}).slice(0, 80) + ")";
  const pre = document.createElement("pre");
  const raw = result === undefined || result === null
    ? "(no output)"
    : typeof result === "string" ? result : JSON.stringify(result, null, 2);
  pre.textContent = raw.slice(0, 4000);
  el.appendChild(s); el.appendChild(pre);
  log.appendChild(el);
  log.scrollTop = log.scrollHeight;
}
function notice(text) {
  const el = document.createElement("div");
  el.className = "notice"; el.textContent = text;
  log.appendChild(el); log.scrollTop = log.scrollHeight;
}

// 转录条目结构：{ kind, model: [ pi message ] }
// pi message: {role:"user",content:"..."} | {role:"assistant",content:[{type:"text"|"thinking"|"toolCall"}]}
//             | {role:"toolResult",toolName,content:[{type:"text"}]}
function textOf(parts) {
  if (typeof parts === "string") return parts.trim();
  if (!Array.isArray(parts)) return "";
  return parts.map(p => (p && typeof p.text === "string" ? p.text : "")).join("").trim();
}

function renderEntries(entries) {
  if (!Array.isArray(entries)) return;
  for (const e of entries) {
    const msgs = Array.isArray(e?.model) ? e.model : [];
    for (const m of msgs) {
      const role = m?.role;
      if (role === "user") {
        const t = textOf(m.content);
        if (t) bubble("user", t);
      } else if (role === "assistant") {
        const t = textOf((m.content ?? []).filter(p => p?.type === "text"));
        if (t) bubble("bot", t);
        for (const p of m.content ?? []) {
          if (p?.type === "toolCall") toolLine(p.name ?? "tool", p.arguments, "(调用中)");
        }
      } else if (role === "toolResult") {
        toolLine(m.toolName ?? "tool", {}, textOf(m.content) || "(空)");
      }
    }
    if (msgs.length === 0 && e?.kind && !String(e.kind).includes("reset")) {
      const el = document.createElement("details");
      el.className = "raw";
      const s = document.createElement("summary"); s.textContent = "· " + e.kind;
      const pre = document.createElement("pre"); pre.textContent = JSON.stringify(e, null, 2).slice(0, 2000);
      el.appendChild(s); el.appendChild(pre); log.appendChild(el);
    }
  }
  log.scrollTop = log.scrollHeight;
}

async function refreshStatus() {
  try {
    const h = await (await fetch("/api/health")).json();
    $("model").textContent = "model: " + h.model;
    const s = await (await fetch("/api/status")).json();
    const status = s?.kb?.status ?? s?.kb?.error ?? "unknown";
    const chip = $("kb");
    chip.textContent = "AI Search: " + status;
    chip.className = "chip " + (/error|not found|not exist/i.test(String(status)) ? "err" : /ready|indexed|complete|waiting/i.test(String(status)) ? "ok" : "warn");
  } catch { $("model").textContent = "model: ?"; $("kb").textContent = "AI Search: ?"; }
}

async function loadTranscript() {
  try {
    const entries = await (await fetch("/api/messages")).json();
    log.innerHTML = "";
    if (!Array.isArray(entries) || entries.length === 0) { notice("（转录为空或尚无会话）"); return; }
    renderEntries(entries);
  } catch (e) { notice("读取转录失败：" + e.message); }
}

$("setup").onclick = async () => {
  $("setup").disabled = true;
  notice("初始化知识库…");
  try {
    const r = await (await fetch("/api/setup", { method: "POST" })).json();
    notice("setup: " + JSON.stringify(r));
    refreshStatus();
  } catch (e) { notice("setup 失败：" + e.message); }
  $("setup").disabled = false;
};
$("transcript").onclick = loadTranscript;
$("reset").onclick = async () => {
  await fetch("/api/reset", { method: "POST" });
  log.innerHTML = ""; notice("会话已重置。");
};

async function send() {
  const input = $("input");
  const text = input.value.trim();
  if (!text || busy) return;
  busy = true; $("send").disabled = true;
  input.value = "";
  bubble("user", text);
  const pending = bubble("bot", "…");
  try {
    const r = await fetch("/api/chat", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ message: text }) });
    const data = await r.json();
    pending.textContent = data.text ?? data.error ?? ("错误: " + JSON.stringify(data));
  } catch (e) {
    pending.textContent = "请求失败: " + e.message;
  }
  busy = false; $("send").disabled = false;
  log.scrollTop = log.scrollHeight;
}
$("send").onclick = send;
$("input").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
});

refreshStatus();
loadTranscript();
</script>
</body>
</html>
